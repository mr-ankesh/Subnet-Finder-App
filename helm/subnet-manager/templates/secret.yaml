{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.values.FLASK_SECRET_KEY }}
{{- fail "Set secrets.values.FLASK_SECRET_KEY (openssl rand -hex 32) or point secrets.existingSecret at a pre-created secret. It must be stable across upgrades — it encrypts stored settings secrets." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "subnet-manager.fullname" . }}
  labels:
    {{- include "subnet-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.database.url }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
