{{- $pg := include "subnet-manager.usePostgres" . -}}
{{- if and (gt (int .Values.replicaCount) 1) (not $pg) }}
{{- fail "replicaCount > 1 requires Postgres — the SQLite backend is single-writer. Set database.url (or database.existingSecretName) to an external PostgreSQL, then scale out." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "subnet-manager.fullname" . }}
  labels:
    {{- include "subnet-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ if $pg }}{{ .Values.replicaCount }}{{ else }}1{{ end }}
  strategy:
    # SQLite → Recreate (single writer). Postgres → rolling, zero-downtime.
    type: {{ if $pg }}RollingUpdate{{ else }}Recreate{{ end }}
  selector:
    matchLabels:
      {{- include "subnet-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "subnet-manager.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod automatically when bootstrap config/secrets change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "subnet-manager.fullname" . }}
            - secretRef:
                name: {{ include "subnet-manager.secretName" . }}
          {{- if .Values.database.existingSecretName }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecretName }}
                  key: {{ .Values.database.existingSecretKey | default "DATABASE_URL" }}
          {{- end }}
          {{- if and .Values.persistence.enabled (not $pg) }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if and .Values.persistence.enabled (not $pg) }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "subnet-manager.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
