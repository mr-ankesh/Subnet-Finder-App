kb_version: "1.0.0"
service: storage_account
description: >
  Deterministic decision logic. This runs BEFORE the LLM and its output is authoritative.
  The LLM may explain these outcomes; it may never contradict or override them.

execution_order:
  - blockers          # stop the conversation entirely
  - escalations       # continue, but flag for a human
  - constants         # Presight standards, applied unconditionally
  - derivations       # infer answers from other answers
  - pattern_selection # score the catalog
  - deviations        # record anything departing from baseline
  - warnings          # advisory notes surfaced to the user

# ─────────────────────────────────────────────────────────────
# 1. BLOCKERS — stop and redirect
# ─────────────────────────────────────────────────────────────
blockers:

  - id: no_subscription
    when: "subscription_available == false"
    message: >
      You'll need an Azure subscription before anything can be provisioned. Please request
      one through the **HALO portal**. Once it's approved, return here with the
      subscription ID and we'll continue from where we left off.
    halt: true

  - id: public_access_requested
    when: "user_requests_public_endpoint == true"
    message: >
      Public network access isn't available for Presight storage. Azure Policy at the
      Landing Zones/Corp scope denies PaaS resources with exposed public endpoints, and
      AlMadar's deploy engine hardcodes public access to disabled. If your workload
      genuinely cannot use a private endpoint, that needs a policy exception agreed with
      the platform and security teams before a request can be raised.
    halt: true
    source: "G42-AzurePlatformDesign-v1.2 §2.2.4 — deny PaaS with exposed public endpoints"

  - id: sovereign_data
    when: "data_classification == restricted_sovereign"
    message: >
      Data under sovereignty or regulatory controls follows the Confidential Corp path,
      which has its own management group, policy set and approval route. I can't
      recommend a standard pattern for it. Please engage the platform and security teams
      directly — I'll capture what you've told me so far so you don't have to repeat it.
    halt: true
    source: "G42-AzurePlatformDesign-v1.2 §2.2.2 — separate management groups for Confidential Corp"

# ─────────────────────────────────────────────────────────────
# 2. ESCALATIONS — continue, but flag
# ─────────────────────────────────────────────────────────────
escalations:

  - id: external_consumer
    when: "'external_system' in consumer"
    flag: EXTERNAL_ACCESS_REVIEW
    message: >
      You mentioned a system outside Presight needs access. That isn't covered by the
      standard patterns — I'll flag it for the platform team to review alongside your
      request rather than designing it here.

  - id: premium_permanent
    when: "performance_requirement == premium_justified and workload_duration == permanent"
    flag: PREMIUM_PERMANENT_REVIEW
    message: >
      Presight provisions Premium storage temporarily — data is copied in for the duration
      of a workload and the account is removed afterwards. A permanent Premium account is
      a departure from that decision and needs sign-off from the platform team.
    source: "Presight Storage Design Document §2.4 — Premium provisioned temporarily, then deprovisioned"

  - id: premium_unmeasured
    when: "performance_requirement == premium_justified and performance_evidence is empty"
    flag: PREMIUM_UNSUBSTANTIATED
    message: >
      Premium needs a measured requirement, not an expectation. I'll recommend Standard
      and note that Premium can be revisited once you have IOPS, throughput or latency
      figures showing Standard isn't sufficient.
    override: "performance_requirement = standard_ok"

  - id: immutability_requested
    when: "immutability_required == true"
    flag: WORM_POLICY_REVIEW
    message: >
      Immutability (WORM) is a compliance control with operational consequences — once a
      time-based retention policy is locked, data cannot be deleted until it expires.
      I'll include it in the recommendation and flag it for compliance review.

# ─────────────────────────────────────────────────────────────
# 3. CONSTANTS — Presight standards, never user choices
# ─────────────────────────────────────────────────────────────
constants:

  replication:
    value: ZRS
    applies_to: all
    except:
      - pattern: storage_archive_retention
        value: LRS or GRS
        reason: Archive access tier supports LRS and GRS only.
    source: "Presight Storage Design Document §2.2, §2.4 — ZRS for all storages"

  performance_tier:
    value: Standard
    applies_to: all
    except:
      - pattern: storage_premium_temporary
        value: Premium
        reason: Measured requirement that Standard cannot meet, time-boxed.
    source: "Presight Storage Design Document §2.4 — Standard GPv2 for all workloads"

  account_kind:
    value: StorageV2
    source: "Presight Storage Design Document §2.4"

  encryption:
    value: CMK
    key_vault_sku: Premium
    key_type: RSA-HSM
    identity_type: UserAssigned
    key_rotation: Automatic per platform policy
    source: "Presight Storage Design Document §2.3 — encrypting all data leveraging CMK"

  network:
    public_network_access: Disabled
    network_default_action: Deny
    private_endpoint: Required
    private_dns_integration: Required
    source: "G42-AzurePlatformDesign-v1.2 §2.2.4 — deny public PaaS endpoints; require private DNS integration"

  transport:
    min_tls_version: "TLS1_2"
    https_traffic_only: true
    allow_shared_key_access: false
    allow_blob_public_access: false
    infrastructure_encryption: true
    source: "Presight Storage Design Document §3.1.2 — TLS 1.2 minimum"

  governance:
    resource_lock: CanNotDelete
    defender_for_storage: enabled
    diagnostics_to: Operational Log Analytics Workspace
    security_logs_to: Security Log Analytics Workspace
    source: "G42-AzurePlatformDesign-v1.2 §2.2.1 DD-GOV-7 — locks on Storage Accounts"

  region:
    primary: uaenorth
    secondary: uaecentral
    secondary_requires_justification: true

# ─────────────────────────────────────────────────────────────
# 4. DERIVATIONS — infer, don't ask twice
# ─────────────────────────────────────────────────────────────
derivations:

  - id: derive_shape_from_protocol
    when: "data_shape == unsure"
    logic:
      - if: "'smb' in access_protocol or 'nfs_posix' in access_protocol"
        set: "data_shape = shared_file_system"
      - if: "'abfs' in access_protocol"
        set: "data_shape = analytics_datalake"
      - if: "'rest_sdk' in access_protocol or 'blobfuse' in access_protocol"
        set: "data_shape = unstructured_objects"

  - id: derive_shape_from_purpose
    when: "data_shape == unsure"
    logic:
      - if: "purpose in [shared_drive]"
        set: "data_shape = shared_file_system"
      - if: "purpose in [analytics_datalake]"
        set: "data_shape = analytics_datalake"
      - if: "purpose in [application_files, logs_telemetry, media_documents, backup_copy, compliance_retention]"
        set: "data_shape = unstructured_objects"

  - id: derive_tier_from_frequency
    logic:
      - if: "access_frequency == frequent"
        set: "access_tier = Hot"
      - if: "access_frequency == mixed"
        set: "access_tier = Hot; lifecycle_policy = recommended"
      - if: "access_frequency == infrequent"
        set: "access_tier = Cool"
      - if: "access_frequency == rare_archive"
        set: "access_tier = Cool; lifecycle_to_archive = true"
    source: "Presight Storage Design Document §2.7 — access tier selection"

  - id: derive_zpa_need
    logic:
      - if: "'end_user_zpa' in consumer"
        set: "zpa_routing_required = true"
      - else:
        set: "zpa_routing_required = false"

  - id: derive_dns_zone
    logic:
      - if: "data_shape == unstructured_objects"
        set: "private_dns_zone = privatelink.blob.core.windows.net; pe_sub_resource = blob"
      - if: "data_shape == shared_file_system"
        set: "private_dns_zone = privatelink.file.core.windows.net; pe_sub_resource = file"
      - if: "data_shape == analytics_datalake"
        set: "private_dns_zone = privatelink.dfs.core.windows.net; pe_sub_resource = dfs"

  - id: derive_classification_default
    when: "data_classification == unsure"
    set: "data_classification = confidential"
    warn: "Classification defaulted to Confidential. Confirm with your data owner."

  - id: derive_cmk_emphasis
    when: "data_classification in [confidential, restricted]"
    set: "cmk_emphasis = true"
    note: CMK applies to all Presight storage; for sensitive data, state it prominently.

# ─────────────────────────────────────────────────────────────
# 5. PATTERN SELECTION
# ─────────────────────────────────────────────────────────────
pattern_selection:
  method: >
    Exclude any pattern whose `match.disqualify` matches, or whose `match.required` is
    unsatisfied. Score the remainder by counting satisfied `match.preferred` entries.
    Highest score wins. On a tie, prefer status `approved` over `conditional`, then
    catalog declaration order.

  overrides:
    - id: premium_override
      when: "performance_requirement == premium_justified and workload_duration == temporary_bounded"
      select: storage_premium_temporary

    - id: archive_override
      when: "access_frequency == rare_archive and purpose in [compliance_retention, backup_copy]"
      select: storage_archive_retention

  tiebreak_questions:
    - when: "score tied between storage_blob_private_standard and storage_files_private_standard"
      ask: >
        One more thing — will the application mount this like a network drive, or read and
        write files through code? A mounted drive means a file share; code access means
        object storage.

  no_match:
    message: >
      I don't have enough to pick a standard pattern confidently. Rather than guess, let me
      capture what you've told me and route this to the platform team for a short design
      conversation.
    action: ESCALATE_TO_PLATFORM_TEAM

# ─────────────────────────────────────────────────────────────
# 6. DEVIATIONS — must be surfaced explicitly
# ─────────────────────────────────────────────────────────────
deviations:
  - id: archive_replication
    when: "selected_pattern == storage_archive_retention"
    state: >
      Note: the archive tier supports LRS and GRS only, so this account will not use ZRS
      like the rest of Presight storage. That's a documented Azure constraint, not an
      oversight — please confirm you're comfortable with it.

  - id: premium_tier
    when: "selected_pattern == storage_premium_temporary"
    state: >
      Note: Presight standardises on the Standard tier. This Premium account is expected to
      be temporary — data copied in for the workload, account removed afterwards. Please
      confirm an owner and an expected end date.

  - id: non_standard_region
    when: "region != uaenorth"
    state: >
      Note: UAE North is the Presight primary region. A non-standard region needs
      justification, which will be reviewed with the request.

# ─────────────────────────────────────────────────────────────
# 7. WARNINGS
# ─────────────────────────────────────────────────────────────
warnings:
  - id: no_network_yet
    when: "network_details_known == false"
    message: >
      You'll need an onboarded VNET and subnet for the private endpoint. If your network
      isn't onboarded, raise a New VNET or New Subnet request first.

  - id: dns_is_mandatory
    when: "always"
    message: >
      The DNS link is not optional. Without it, clients resolve the storage account to its
      public IP and the connection fails, even though the private endpoint exists.

  - id: hns_irreversible
    when: "selected_pattern == storage_datalake_private"
    message: >
      Hierarchical namespace can't be turned off after the account is created, and it
      changes pricing and some blob feature behaviour. Only proceed if the analytics
      engine genuinely requires it.

  - id: archive_rehydration
    when: "selected_pattern == storage_archive_retention"
    message: >
      Archived data is offline. Reading it requires rehydration, which takes hours and
      carries a retrieval charge.

  - id: capacity_unknown
    when: "capacity_estimate is empty or capacity_estimate contains 'not sure'"
    message: >
      No capacity estimate given. That's fine for now, but very large volumes can hit
      account-level service limits — worth confirming before go-live.
