kb_version: "2.0.0"
service: postgres_create
description: Deterministic rules for managed PostgreSQL. Shared standards live in platform_constants.yaml.
execution_order: [blockers, escalations, derivations, pattern_selection, deviations, warnings]

blockers:
  - id: no_subscription
    when: "subscription_available == false"
    message: >
      You'll need an Azure subscription first — please request one through the **HALO
      portal**, then come back with the ID.
    halt: true
  - id: sovereign_data
    when: "data_classification == restricted_sovereign"
    message: >
      Sovereign or regulator-controlled data follows the Confidential Corp path. I'll package
      what you've told me for the platform and security teams.
    halt: true

escalations:
  - id: self_managed
    when: "managed_preference == self_managed"
    message: >
      Full control means running PostgreSQL on a VM — a different pattern, and you take on
      backups, patching and failover. Worth confirming that's genuinely needed before giving
      up managed backups and point-in-time restore.
    redirect: vm_workload_standard

derivations:
  - {when: "environment == prd and ha_requirement == unsure", set: "ha_requirement = zone_redundant"}
  - {when: "environment in [dev, tst, snd] and ha_requirement == unsure", set: "ha_requirement = single"}
  - {when: "always", set: "pe_sub_resource = postgresqlServer"}
  - {when: "always", set: "private_dns_zone = privatelink.postgres.database.azure.com"}
  - {when: "environment == prd", set: "compute_tier_hint = general_purpose"}
  - {when: "environment in [dev, snd]", set: "compute_tier_hint = burstable"}

pattern_selection:
  default: postgres_flexible_private

deviations:
  - when: "environment == prd and ha_requirement == single"
    state: >
      This is production without zone-redundant HA. That may be a deliberate cost decision —
      flagging so it's an explicit one.
  - when: "environment in [dev, tst, snd] and ha_requirement == zone_redundant"
    state: >
      Zone-redundant HA roughly doubles compute cost. Unusual for non-production — flagging
      so the cost is deliberate.

warnings:
  - id: dns_mandatory
    when: "always"
    message: >
      Without the private DNS zone link, the client resolves the public name and the
      connection fails — even though the private endpoint exists and looks healthy.
  - id: access_model_consistency
    when: "always"
    message: >
      Presight uses private endpoints for PostgreSQL rather than VNET injection. Don't mix
      the two models within one environment without agreement.
  - id: burstable_not_prod
    when: "compute_tier == burstable and environment == prd"
    message: "Burstable tiers are for sandbox and light development, not production workloads."
