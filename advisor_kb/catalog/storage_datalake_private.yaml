kb_version: "1.0.0"
id: storage_datalake_private
name: Private Data Lake (ADLS Gen2, hierarchical namespace)
service: storage_account
selectable: true
status: conditional
condition: >
  Only when an analytics engine or a directory-semantics requirement genuinely needs
  hierarchical namespace. HNS changes pricing and disables some blob features, so it must
  not be enabled "just in case".
summary: >
  Standard GPv2 with hierarchical namespace enabled for analytics workloads that need
  directory semantics and POSIX-style ACLs. ZRS, CMK-encrypted, private endpoint only.

when_to_use:
  - data lake landing / curated zones for analytics
  - Spark, Databricks, Synapse or similar engines reading directory trees
  - workloads needing atomic directory rename or directory-level ACLs
  - replacing G42 Cloud Object Store Service used as a parallel file system

not_for:
  - plain object storage without analytics       -> storage_blob_private_standard
  - mounted SMB/NFS 4.1 share                    -> storage_files_private_standard
  - archive-only retention                       -> storage_archive_retention

match:
  required:
    data_shape: [analytics_datalake]
  preferred:
    consumer: [aks, analytics_engine]
    access_protocol: [abfs, rest_sdk]
  disqualify:
    data_classification: [restricted_sovereign]

design:
  storage_kind: StorageV2
  performance_tier: Standard
  sku: Standard_ZRS
  replication: ZRS
  hierarchical_namespace: true
  access_tier: Hot
  private_endpoint:
    required: true
    sub_resource: dfs
    dns_zone: privatelink.dfs.core.windows.net
    note: >
      Workloads that also call the blob endpoint need the blob private endpoint and
      privatelink.blob.core.windows.net linked as well. Confirm which endpoints the
      analytics engine uses before raising the DNS requests.
  nfs3_option:
    available: true
    note: NFS 3.0 requires hierarchical namespace and carries documented limitations.
  data_protection:
    blob_soft_delete: enabled
    versioning: evaluate
    note: >
      Some blob features behave differently or are unavailable once HNS is enabled —
      confirm versioning/change-feed support against current Azure documentation before
      committing to a recovery design.
  monitoring:
    defender_for_storage: enabled
    diagnostics_to: Operational Log Analytics Workspace
    security_logs_to: Security Log Analytics Workspace

security_floor:
  public_network_access: Disabled
  min_tls_version: "TLS1_2"
  https_traffic_only: true
  allow_shared_key_access: false
  allow_blob_public_access: false
  infrastructure_encryption: true
  network_default_action: Deny
  encryption: CMK
  key_vault_sku: Premium
  key_type: RSA-HSM
  identity_type: UserAssigned
  resource_lock: CanNotDelete

required_requests:
  - order: 1
    type: storage_account_create
    label: Storage Account (ADLS Gen2)
  - order: 2
    type: private_endpoint
    label: Private Endpoint (dfs, and blob if required)
  - order: 3
    type: dns
    label: DNS — link privatelink.dfs.core.windows.net (and .blob if required)

prerequisites:
  - An Azure subscription. If absent, request it from the HALO portal first.
  - An onboarded spoke VNET and subnet.
  - Key Vault Premium with RSA-HSM key and a user-assigned managed identity.
  - Confirmation from the workload owner that hierarchical namespace is actually required.

diagram: storage_datalake_private.mmd
cost_band: "$$"

source:
  - doc: Presight Storage Design Document
    section: "2.4 Cost Optimization"
    states: >
      Using hierarchical namespaces and enabling NFS affects the price of the storage and
      operations, and enabling hierarchical namespaces also has functionality impact.
  - doc: Presight Storage Design Document
    section: "2.8 G42 Cloud to Microsoft Azure Storage Mapping"
    states: >
      Object Store Service - Parallel File Systems maps to blob with NFS enabled, blob with
      Blobfuse, or Azure Files.
