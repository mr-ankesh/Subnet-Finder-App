kb_version: "2.0.0"
id: aks_private_standard
name: Private AKS Cluster (Standard Tier)
service: aks_cluster
status: approved
summary: >
  Default Presight pattern for containerised workloads. Private API server, Azure CNI
  Overlay into an onboarded spoke subnet, system + user node pools, egress via hub firewall,
  no public node IPs.
when_to_use:
  - containerised application workloads
  - microservices platforms
  - workloads already packaged as Helm charts or Kubernetes manifests
not_for:
  - a single application that runs fine on a VM  -> vm_workload_standard
  - GPU inference or training                    -> aks_gpu_nodepool
match:
  required: {workload_shape: [containerised]}
  preferred:
    consumer: [internal_app, api, microservices]
    scaling_need: [autoscale, variable_load]
  disqualify: {data_classification: [restricted_sovereign]}
design:
  tier: Standard
  tier_note: >
    Standard includes an SLA-backed control plane. Free has no SLA — sandbox only. Premium
    adds a longer support window; select only for a specific version-support requirement.
  api_server_access: private
  network_plugin: Azure CNI Overlay
  network_plugin_note: >
    Pods get addresses from a separate overlay Pod CIDR (Presight default: 10.244.0.0/16),
    not the VNET subnet — only nodes consume subnet IPs. This is the Presight default
    (Settings → AKS Defaults: Network plugin mode = overlay) and replaces classic
    VNET-integrated Azure CNI, whose per-pod VNET IP consumption was a recurring subnet-
    exhaustion problem. The Pod CIDR itself still needs planning: it must not collide with
    the VNET, hub, VPN, ZPA or any peered range across the estate, since traffic can still
    need to route correctly if the cluster's network posture changes later.
  node_pools:
    system:
      purpose: Kubernetes system components only
      min_nodes: 3
      sku_guidance: General-purpose D-series
      taints: CriticalAddonsOnly recommended so application pods stay off it
    user:
      purpose: Application workloads
      min_nodes: 3
      autoscaler: enabled
  os_disk: >
    Upgrade from the default small Standard HDD to at least a P10 Premium SSD — the default
    disk is a common source of node performance problems.
  egress:
    via: Hub Azure Firewall by default
    alternative: NAT Gateway where the workload needs high outbound connection volume
    rule: Nodes never get public IPs.
  ingress:
    internal: Internal load balancer inside the spoke
    external: Only via Application Gateway — see appgw_public_cloudflare and the InfoSec gate
  acr:
    required: true
    access: Private endpoint, privatelink.azurecr.io
  storage_classes: [azure-disk-zrs-retain, azurefile-csi-premium]
  network_policy:
    enabled: true
    baseline: Default-deny per namespace, then explicit allow
    detail: >
      Default deny at namespace level; allow intra-namespace pod traffic; allow ingress from
      the ingress namespace; restrict application namespace egress to approved targets only.
  identity: User-assigned managed identity
  encryption: CMK for OS and data disks
  monitoring: {container_insights: enabled}
  backup: {vault_type: Backup Vault, scope: Azure Kubernetes Service}
security_floor:
  private_api_server: true
  public_node_ips: false
  network_policy: enabled
  cmk_disk_encryption: true
  nsg_on_subnet: required
  default_route_via_firewall: true
  gateway_route_propagation: disabled
required_requests:
  - {order: 1, type: vnet_new, label: New VNET / New Subnet, condition: no onboarded AKS subnet yet}
  - {order: 2, type: aks_cluster, label: AKS Cluster}
  - {order: 3, type: dns, label: "DNS — link the AKS private zone and any PaaS privatelink zones"}
  - {order: 4, type: firewall_policy, label: Firewall rules for egress, condition: workload needs specific outbound destinations}
  - {order: 5, type: zpa_rnd_routing, label: ZPA Routing, condition: engineers need kubectl access}
prerequisites:
  - An Azure subscription. If absent, request it from the HALO portal first.
  - An onboarded spoke VNET with a dedicated AKS subnet, correctly sized for nodes (Azure
    CNI Overlay means pods use a separate Pod CIDR, not the subnet).
  - Key Vault Premium with an RSA-HSM key and a user-assigned managed identity.
  - An Azure Container Registry, or a request to create one.
diagram: aks_private.mmd
cost_band: "$$"
source:
  - {doc: G42-Azure Platform Design - Diagrams, section: "Azure Platform Landing Zone with AKS Landing Zone"}
  - {doc: Vitruvian_BoQ_Azure, section: "3. Azure Kubernetes Service", states: "System node pool and user node pools; Standard tier SLA-backed control plane; ACR attached for private image pulls; azurefile-csi-premium and azure-disk-zrs-retain storage classes; autoscaler enabled; OS disk upgraded from default S4 to at least P10."}
  - {doc: Vitruvian_BoQ_Azure, section: "6. Networking", states: "NAT Gateway provides outbound connectivity for AKS nodes without exposing public IPs; Private Link secures connectivity to PostgreSQL, Redis, Blob and ACR."}
  - {doc: DMZ-Landing-Zone-Design-Document, section: "Network Policy Implementation", states: "Default deny at namespace level; allow intra-namespace pod communication; restrict egress to approved targets."}
  - {doc: "Presight AlMadar 360 — Settings → AKS Defaults (config.py)", section: "AKS_NETWORK_PLUGIN / AKS_NETWORK_PLUGIN_MODE / AKS_POD_CIDR", states: "Live app default: network plugin azure, plugin mode overlay, pod CIDR 10.244.0.0/16 — not a cited design document, but the portal's own actual deploy-time default, confirmed against the running app rather than assumed."}
