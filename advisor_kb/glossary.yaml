kb_version: "2.2.0"
scope: all_services
description: >
  Plain-English definitions for every term the Advisor uses in its recommendations. This
  exists so "what does that mean?" is answered deterministically from the KB rather than
  regenerated by the LLM each time.

  Each entry has three layers:
    plain_english  — what it is, assuming no Azure knowledge
    at_presight    — how it is used here specifically, and what is standard
    why_it_matters — the consequence of getting it wrong, where there is one

  The LLM may rephrase for the reader's level. It must not contradict `at_presight`, and it
  must not add Presight-specific claims that aren't here.

usage_rules:
  - When a term in this glossary appears in a free-form question, answer from here first.
  - Always give plain_english before at_presight. The reader asked because they didn't know.
  - If a term is NOT in this glossary and not in the pattern catalog, say so explicitly and
    label the answer as general Azure background, not Presight guidance.
  - Never present a term's `at_presight` value as optional or negotiable.
  - Offer the `related` terms as follow-ups rather than explaining them unprompted.

terms:

  # ── Networking foundations ────────────────────────────────
  - term: VNET
    aliases: [virtual network, vnet]
    plain_english: >
      A private network inside Azure. Resources placed in it can talk to each other using
      private IP addresses, the same way machines on an office network can.
    at_presight: >
      Every workload lives in a "spoke" VNET that connects back to a central "hub" VNET.
      Workloads never deploy directly into the hub.
    related: [subnet, hub_and_spoke, CIDR]

  - term: subnet
    plain_english: >
      A slice of a VNET's address range, used to group resources that share the same network
      rules. A VNET is divided into subnets the way a building is divided into floors.
    at_presight: >
      Separate subnets per purpose — one for the Application Gateway, one for AKS nodes, one
      for VMs, one for private endpoints. Each carries its own NSG.
    why_it_matters: >
      A subnet cannot be resized once resources are deployed into it. Getting the size wrong
      means rebuilding, not adjusting.
    related: [VNET, CIDR, NSG]

  - term: CIDR
    aliases: ["/24", "address space", "address range"]
    plain_english: >
      Notation for a block of IP addresses. The number after the slash says how big the block
      is — the smaller the number, the bigger the block. A /24 holds 256 addresses, a /23
      holds 512.
    at_presight: >
      Ranges are allocated by TechOps from 10.110.0.0/16 (primary) or 10.119.0.0/16
      (secondary). The Advisor proposes a size; TechOps assigns the actual range.
    why_it_matters: >
      Azure reserves 5 addresses in every subnet, so a /28 gives 11 usable, not 16. Overlapping
      ranges between spokes cause routing failures that are painful to unpick.
    related: [subnet, VNET]

  - term: hub_and_spoke
    aliases: [hub and spoke, hub, connectivity VNET]
    plain_english: >
      A network layout where every workload network (spoke) connects to one shared central
      network (hub). The hub holds the things everyone needs — firewall, DNS, connectivity to
      the outside world.
    at_presight: >
      The Connectivity VNET is the hub. Every new spoke is peered to it, gets a default route
      through the hub firewall, and has the hub's route tables updated to know about it.
    related: [VNET, azure_firewall, UDR, peering]

  - term: peering
    aliases: [vnet peering, hub peering]
    plain_english: >
      A direct connection between two VNETs that lets resources in each reach the other over
      private addresses.
    at_presight: >
      TechOps owns hub-spoke peering. It's set up as part of the New VNET request, in both
      directions, with the correct gateway transit settings.
    related: [hub_and_spoke, VNET]

  - term: UDR
    aliases: [route table, user defined route, custom route]
    plain_english: >
      A rule that tells Azure where to send traffic, overriding its default behaviour.
    at_presight: >
      Every spoke subnet gets a base route sending all internet-bound traffic (0.0.0.0/0)
      through the hub's Azure Firewall rather than straight out.
    why_it_matters: >
      Gateway route propagation must be disabled wherever a custom UDR applies, or routes
      injected from the VPN or ExpressRoute gateway make traffic paths unpredictable.
    related: [azure_firewall, hub_and_spoke, gateway_route_propagation]

  - term: gateway_route_propagation
    plain_english: >
      An Azure setting that automatically adds routes learned from a VPN or ExpressRoute
      gateway into a subnet's route table.
    at_presight: >
      Explicitly disabled on any subnet carrying a custom UDR. This is mandatory, not a
      preference.
    why_it_matters: >
      Left on, it injects routes you didn't choose and makes traffic paths non-deterministic —
      the kind of problem that only shows up under load or after an unrelated change.
    related: [UDR]

  - term: NSG
    aliases: [network security group]
    plain_english: >
      A firewall that sits on a subnet or network interface, allowing or blocking traffic
      based on source, destination and port.
    at_presight: >
      Required on every subnet. VMs don't get their own NSG — the subnet's applies.
    related: [subnet, azure_firewall]

  - term: azure_firewall
    plain_english: >
      A managed firewall service that inspects and controls traffic leaving or crossing the
      network.
    at_presight: >
      Lives in the hub. All outbound internet traffic from every spoke routes through it, so
      egress is inspected in one place rather than per-workload.
    related: [hub_and_spoke, UDR]

  - term: ZPA
    aliases: [zscaler private access, zpa routing]
    plain_english: >
      A service that gives people access to internal applications without putting those
      applications on the internet. You connect to ZPA, and it connects you onward.
    at_presight: >
      The standard way engineers and staff reach internal resources — VMs, clusters, internal
      web apps. It is the alternative to a public endpoint, not a supplement to one.
    related: [private_endpoint, public_exposure]

  # ── Private connectivity ──────────────────────────────────
  - term: private_endpoint
    aliases: [PE, private link]
    plain_english: >
      A private IP address inside your own network that points at an Azure service such as a
      database or storage account. The service becomes reachable from your network without
      being reachable from the internet.
    at_presight: >
      Mandatory for every PaaS service. Azure Policy blocks PaaS resources that expose public
      endpoints, so this is the only way to connect.
    why_it_matters: >
      A private endpoint on its own is not enough — without the matching private DNS zone
      link, clients still resolve the public name and the connection fails.
    related: [private_dns_zone, PaaS, public_exposure]

  - term: private_dns_zone
    aliases: [privatelink zone, dns zone link]
    plain_english: >
      A private address book that translates a service's name into its private IP address
      instead of its public one.
    at_presight: >
      Zones live in the hub and are linked to each spoke that needs to resolve them. Linking
      is a separate DNS request and is never optional.
    why_it_matters: >
      This is the single most common reason a correctly-built private setup appears broken.
      The endpoint looks healthy, the name resolves to a public IP, and the connection times
      out with no obvious cause.
    related: [private_endpoint]

  - term: PaaS
    aliases: [platform as a service, managed service]
    plain_english: >
      An Azure service you consume rather than run — storage accounts, managed databases, key
      vaults. Microsoft operates the underlying machines.
    at_presight: >
      All PaaS is private-only: public network access disabled, reached over a private
      endpoint, with the DNS zone linked.
    related: [private_endpoint, private_dns_zone]

  # ── Encryption & identity ─────────────────────────────────
  - term: CMK
    aliases: [customer managed key, customer-managed key]
    plain_english: >
      Encryption using a key you control and can revoke, rather than one Microsoft manages
      invisibly.
    at_presight: >
      Standard for all data at rest — storage, disks, databases. The key lives in Key Vault
      Premium and is an RSA-HSM key.
    related: [key_vault, RSA_HSM, managed_identity]

  - term: key_vault
    aliases: [key vault, keyvault, akv]
    plain_english: >
      A secure store for encryption keys, certificates and application secrets.
    at_presight: >
      Premium tier, because that's what supports hardware-backed keys. Soft delete and purge
      protection are always on, and it's usually the first thing built in a new environment.
    why_it_matters: >
      Purge protection cannot be turned off once enabled. That's deliberate — without it, a
      deleted key can be destroyed permanently, taking every resource encrypted with it.
    related: [CMK, RSA_HSM, managed_identity]

  - term: RSA_HSM
    aliases: [HSM, hardware security module, rsa-hsm]
    plain_english: >
      A key stored in dedicated tamper-resistant hardware rather than in software. It can be
      used but never extracted.
    at_presight: >
      The key type used for all CMK encryption, held in Key Vault Premium.
    related: [CMK, key_vault]

  - term: managed_identity
    aliases: [UAMI, user-assigned managed identity, MSI]
    plain_english: >
      An identity Azure gives a resource so it can authenticate to other services without
      anyone storing a password or key in configuration.
    at_presight: >
      User-assigned managed identities are the standard, one per consuming service. Credentials
      in application config are not an accepted pattern.
    related: [key_vault, CMK, RBAC]

  # ── Storage ───────────────────────────────────────────────
  - term: ZRS
    aliases: [zone redundant storage, zone-redundant]
    plain_english: >
      Storage that keeps copies of your data in three separate datacentres within the same
      region, so losing one doesn't lose the data.
    at_presight: >
      The standard for all storage. The one documented exception is the archive tier, which
      Azure only offers as LRS or GRS.
    related: [access_tier]

  - term: access_tier
    aliases: [hot, cool, archive, tier]
    plain_english: >
      How ready your data is to be read. Hot costs more to store but is instantly available;
      Archive is very cheap to store but takes hours to retrieve.
    at_presight: >
      Chosen from how often you'll read the data. Lifecycle rules can move older data to
      cheaper tiers automatically without the application noticing.
    why_it_matters: >
      Archived data is offline. Reading it needs rehydration — hours, plus a retrieval charge.
      It is not suitable for anything time-sensitive.
    related: [ZRS]

  - term: soft_delete
    plain_english: >
      A safety net that keeps deleted data recoverable for a set period instead of removing it
      immediately.
    at_presight: >
      Enabled by default on blobs, containers and file shares. Together with versioning, it's
      the main recovery path for accidental deletion.
    related: [versioning, WORM]

  - term: versioning
    plain_english: >
      Keeping previous copies of a file automatically each time it changes, so you can go back.
    at_presight: >
      Enabled by default on blob storage.
    related: [soft_delete]

  - term: WORM
    aliases: [immutability, immutable storage, legal hold]
    plain_english: >
      Write once, read many — data that cannot be changed or deleted for a fixed period, even
      by an administrator.
    at_presight: >
      Used where retention is a compliance obligation rather than a preference. Once a
      time-based policy is locked, the data cannot be removed until it expires.
    related: [soft_delete, access_tier]

  - term: HNS
    aliases: [hierarchical namespace, ADLS Gen2, data lake]
    plain_english: >
      A storage option that adds real folders with folder-level permissions, rather than
      filenames that merely look like paths.
    at_presight: >
      Only enabled when an analytics engine genuinely needs it. It changes pricing and some
      storage features behave differently.
    why_it_matters: >
      It cannot be turned off after the account is created.

  # ── AKS ───────────────────────────────────────────────────
  - term: AKS
    aliases: [kubernetes, cluster, azure kubernetes service]
    plain_english: >
      A managed Kubernetes service — Azure runs the control plane, you run containers on the
      nodes.
    at_presight: >
      Private API server, Azure CNI Overlay networking, nodes with no public IPs, egress
      through the hub firewall.
    related: [node_pool, overlay, pod_cidr, ACR]

  - term: node_pool
    plain_english: >
      A group of identical virtual machines in a Kubernetes cluster that actually run your
      containers.
    at_presight: >
      A system pool for Kubernetes' own components, and one or more user pools for
      applications. GPU pools are separate and tainted so only GPU workloads land on them.
    related: [AKS, surge_nodes]

  - term: overlay
    aliases: [azure cni overlay, cni overlay, network plugin mode]
    plain_english: >
      A Kubernetes networking mode where containers get addresses from their own private pool
      rather than from the VNET. Traffic leaving the cluster appears to come from the node.
    at_presight: >
      The default. It's why the AKS subnet only needs to be big enough for nodes, not for every
      container.
    why_it_matters: >
      Under the older mode, every container consumed a VNET address and subnets had to be
      roughly ten times larger. Sizing guidance written for that mode is wrong here.
    related: [pod_cidr, AKS, subnet]

  - term: pod_cidr
    aliases: [pod cidr, pod network]
    plain_english: >
      The separate address range containers draw from when the cluster uses Overlay
      networking.
    at_presight: >
      Defaults to 10.244.0.0/16. It is not part of the VNET and isn't taken from the VNET
      pools, but it must not overlap the VNET, the hub, or the VPN and ZPA ranges.
    related: [overlay, AKS, CIDR]

  - term: surge_nodes
    aliases: [max surge, surge]
    plain_english: >
      Temporary extra nodes Kubernetes creates during an upgrade so workloads keep running
      while older nodes are replaced.
    at_presight: >
      The AKS subnet is sized with headroom for them.
    why_it_matters: >
      If the surge nodes don't fit in the subnet, the upgrade stalls part-way through.
    related: [node_pool, overlay, subnet]

  - term: ACR
    aliases: [container registry, azure container registry]
    plain_english: >
      A private store for container images, so clusters pull from somewhere you control rather
      than the public internet.
    at_presight: >
      One per environment, reached over a private endpoint. Attached to the cluster for
      private image pulls.
    related: [AKS, private_endpoint]

  # ── Databases ─────────────────────────────────────────────
  - term: flexible_server
    aliases: [postgresql flexible server, managed postgres]
    plain_english: >
      Azure's managed PostgreSQL. Azure handles patching, backups and failover; you get the
      database without running the server.
    at_presight: >
      Private endpoint only, CMK-encrypted, TLS enforced, backed up to the subscription's
      Backup Vault.
    related: [private_endpoint, HA, PITR]

  - term: HA
    aliases: [high availability, zone redundant HA]
    plain_english: >
      Running a standby copy in a different datacentre so the service survives losing one.
    at_presight: >
      Standard for production databases. Roughly doubles compute cost, so non-production
      usually runs a single instance — that's a deliberate choice, not an oversight.
    related: [flexible_server, RPO_RTO]

  - term: PITR
    aliases: [point in time restore, point-in-time]
    plain_english: >
      Restoring a database to how it looked at a specific moment, rather than only to the last
      full backup.
    at_presight: >
      Enabled with a retention window matched to how much data loss the workload can tolerate.
    related: [flexible_server, RPO_RTO]

  - term: RPO_RTO
    aliases: [RPO, RTO, recovery objective]
    plain_english: >
      RPO is how much data you can afford to lose; RTO is how long you can afford to be down.
    at_presight: >
      Asked up front because together they set backup retention and whether HA is justified.
    related: [HA, PITR]

  # ── Public exposure ───────────────────────────────────────
  - term: WAF
    aliases: [web application firewall]
    plain_english: >
      A filter in front of a web application that blocks common attacks — injection attempts,
      malicious payloads, abusive traffic patterns.
    at_presight: >
      Two independent layers for anything public: one at Cloudflare, one on the Azure
      Application Gateway. Runs in Prevention mode at go-live, not Detection.
    related: [application_gateway, cloudflare, prevention_mode]

  - term: application_gateway
    aliases: [app gateway, appgw]
    plain_english: >
      A load balancer that understands web traffic — it can terminate HTTPS, route by URL
      path, and run a WAF.
    at_presight: >
      The only approved way to expose an application publicly. It needs its own dedicated
      subnet, and its certificate comes from Key Vault.
    related: [WAF, cloudflare, infosec_gate]

  - term: cloudflare
    plain_english: >
      A service that sits in front of a public website, handling its DNS, encryption and a
      first layer of filtering before traffic reaches your infrastructure.
    at_presight: >
      All public traffic arrives via Cloudflare. The Azure gateway behind it accepts
      connections only from Cloudflare's published IP ranges.
    why_it_matters: >
      If the gateway is reachable directly, an attacker skips Cloudflare entirely and every
      protection it provides goes with it. A previous Presight security assessment found
      exactly that — an origin IP answering on an unexpected port.
    related: [application_gateway, WAF, infosec_gate]

  - term: prevention_mode
    aliases: [detection mode, waf mode]
    plain_english: >
      Detection mode logs attacks; Prevention mode blocks them.
    at_presight: >
      Start in Detection to tune out false alarms, then switch to Prevention before go-live.
      Staying in Detection means recording attacks while letting them through.
    related: [WAF]

  - term: infosec_gate
    aliases: [public exposure approval, infosec onboarding]
    plain_english: >
      A formal review before anything at Presight becomes reachable from the internet.
    at_presight: >
      InfoSec owns and approves the public DNS record. It is a process, not a setting, and the
      platform team cannot grant it on their behalf. Building and internal testing continue in
      parallel — only publication waits.
    why_it_matters: >
      Approval is ongoing, not one-off. InfoSec runs periodic audits to confirm the exposure
      still matches what was approved, so the endpoint needs a named technical owner.
    related: [public_exposure, cloudflare, application_gateway]

  - term: public_exposure
    aliases: [public access, internet facing, public IP]
    plain_english: >
      Anything reachable from the open internet — a public DNS name, a public IP, an
      internet-facing endpoint.
    at_presight: >
      Triggers the InfoSec gate. Staff access over ZPA is not public exposure and does not
      trigger it.
    related: [infosec_gate, ZPA, application_gateway]

  # ── Governance ────────────────────────────────────────────
  - term: landing_zone
    plain_english: >
      A pre-built, pre-governed area of Azure — network, identity, policy and logging already
      in place — that workloads deploy into.
    at_presight: >
      Workloads land in the Corp landing zone under the Landing Zones management group, with
      policy applied automatically.
    related: [management_group, azure_policy]

  - term: azure_policy
    plain_english: >
      Rules Azure enforces automatically — blocking resources that don't comply, or fixing
      them.
    at_presight: >
      Two matter most day-to-day: PaaS services with public endpoints are denied, and private
      endpoints must be integrated with private DNS zones.
    related: [landing_zone, private_endpoint]

  - term: management_group
    plain_english: >
      A container for subscriptions, used to apply policy and access rules to many
      subscriptions at once.
    at_presight: >
      Subscriptions sit under management groups that apply the policy baseline automatically.
      Regulated workloads sit under a separate one with its own stricter policy set.
    related: [landing_zone, sovereignty]

  - term: sovereignty
    aliases: [confidential corp, sovereign]
    plain_english: >
      Requirements about where data physically sits and who can access it, usually driven by
      regulation.
    at_presight: >
      Regulated workloads follow a separate path with its own management group, policy set and
      approvals. The Advisor doesn't design for it and will route you to the platform and
      security teams instead.
    related: [management_group, data_classification]

  - term: data_classification
    plain_english: >
      A label saying how sensitive data is — Public, Internal, Confidential, Restricted.
    at_presight: >
      Recorded as a tag on every resource. If you're unsure, Confidential is the safe default,
      but confirm it with whoever owns the data.
    related: [sovereignty, tags]

  - term: tags
    plain_english: >
      Labels attached to Azure resources recording who owns them, what they're for, and how
      critical they are.
    at_presight: >
      A fixed governance set — ApplicationName, BusinessUnit, Criticality, DataClassification,
      Owner, Approver, Environment, ServiceClass, Sovereignty — applied to everything deployed
      through the portal.
    related: [data_classification]

  - term: resource_lock
    plain_english: >
      A setting that prevents a resource being deleted by accident, even by someone with
      permission to delete it.
    at_presight: >
      Applied to Key Vaults, Storage Accounts and other critical resources.
    related: [key_vault]

  - term: RBAC
    aliases: [role based access control, roles]
    plain_english: >
      Controlling who can do what, by assigning roles rather than granting permissions
      individually.
    at_presight: >
      Built-in roles at management group level, with team-specific custom roles. Owner
      assignments per business unit are deliberately limited.
    related: [managed_identity]

  # ── Process ───────────────────────────────────────────────
  - term: HALO
    aliases: [halo portal, subscription request]
    plain_english: >
      The portal where Azure subscriptions are requested at Presight.
    at_presight: >
      Nothing can be provisioned without a subscription, so this is the first step if you don't
      already have one. The Advisor stops and points you there.

  - term: TechOps
    plain_english: >
      The team that owns network connectivity — address allocation, hub peering, routing and
      DNS linking.
    at_presight: >
      Allocates and approves every CIDR before hub integration, which is why the Advisor
      proposes sizes rather than assigning ranges.
    related: [CIDR, hub_and_spoke]

  - term: dry_run
    aliases: [AZURE_DRY_RUN]
    plain_english: >
      A mode where the portal shows exactly what it would do in Azure without actually doing
      it.
    at_presight: >
      Every action that changes Azure passes through this guard, so a deploy can be rehearsed
      before it's real.
    related: [change_ledger]

  - term: change_ledger
    plain_english: >
      A record of every change the portal made to Azure, with the ability to reverse each one
      individually.
    at_presight: >
      Each deployed resource gets its own entry, so a single item can be reverted without
      touching the others.
    related: [dry_run]
