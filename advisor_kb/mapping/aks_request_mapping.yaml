kb_version: "2.0.0"
service: aks_cluster
target_request_type: aks_cluster
description: >
  Maps advisor answers onto AlMadar's AKS request fields. PREFILL ONLY — never auto-submits.
  Existing server-side validation remains the sole authority.

prefill_contract:
  method: Server-side advisor session; open the form with ?advisor_session=<id>
  auto_submit: false
  editable: All prefilled fields remain editable.

locked_fields:
  private_cluster: {value: true, reason: Presight standard}
  network_plugin: {value: azure, reason: Azure CNI is the Presight pattern}
  network_plugin_mode: {value: overlay, reason: "Azure CNI Overlay is the Presight default (Settings -> AKS Defaults) -- pods use a separate Pod CIDR instead of consuming VNET subnet IPs, avoiding classic CNI's subnet-exhaustion problem."}
  network_policy: {value: enabled}
  public_node_ips: {value: false}
  encryption: {value: CMK}

mapped_fields:
  tier: {from: pattern.design.tier, default: Standard}
  node_count: {from: node_count}
  gpu_node_pool: {from: gpu_required}
  region: {from: region, default: uaenorth}
  purpose: {from: workload_description}
  business_justification:
    compose_from: [workload_description, node_count, exposure]
    template: >
      {workload_description} for {application_name}. Approximately {node_count} nodes.
      Recommended by AlMadar AI Architecture Advisor (pattern: {pattern_id}, KB {kb_version}).

tag_mappings:
  ApplicationName: {from: application_name}
  BusinessUnit: {from: business_unit}
  Criticality: {from: criticality}
  DataClassification: {from: data_classification, transform: title_case}
  Environment: {from: environment, transform: expand_abbreviation}
  Owner: {from: owner_email}
  Approver: {from: session.manager_email, optional: true}
  ServiceClass:
    skip: true
    reason: >
      The criticality->service-class mapping is unconfirmed. Left for manual entry,
      consistent with the storage implementation.
  Sovereignty: {value: Standard}

user_must_provide:
  - {field: subscription_id, blocking: true, why: The advisor never enumerates subscriptions the user hasn't named.}
  - {field: resource_group, blocking: true}
  - {field: cluster_name, blocking: true, hint: "aks-<project>-<env>-prs-aen-001"}
  - {field: vnet_name, blocking: true}
  - {field: subnet_name, blocking: true, hint: "Must be the AKS subnet, sized for pods not nodes"}
  - {field: node_vm_size, blocking: false}
  - {field: kubernetes_version, blocking: false}

follow_on_requests:
  - {order: 1, request_type: other, label: GPU quota request, include_if: "gpu_required == true"}
  - {order: 2, request_type: other, label: Azure Container Registry, always: true}
  - {order: 3, request_type: dns, label: "DNS — link the AKS private zone and PaaS privatelink zones", always: true}
  - {order: 4, request_type: firewall_policy, label: "Firewall rules — egress destinations", include_if: "egress_destinations specified"}
  - {order: 5, request_type: zpa_rnd_routing, label: "ZPA Routing — kubectl access", include_if: "engineer_access_needed == true"}
