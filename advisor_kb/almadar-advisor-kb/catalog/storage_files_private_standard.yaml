kb_version: "1.0.0"
id: storage_files_private_standard
name: Private File Share (Azure Files, Standard GPv2)
service: storage_account
status: approved
summary: >
  Shared file-system storage with SMB/NFS 4.1 semantics for workloads that need a mounted
  share rather than object APIs. Standard GPv2, ZRS, CMK-encrypted, private endpoint only.

when_to_use:
  - shared drive for an application or a team
  - lift-and-shift workload that expects a mounted file path
  - SMB share for Windows workloads
  - NFS 4.1 share for Linux workloads
  - replacing G42 Cloud Scalable File System

not_for:
  - object/blob access over REST or SDK          -> storage_blob_private_standard
  - analytics with hierarchical namespace        -> storage_datalake_private
  - sustained high IOPS / low latency            -> storage_premium_temporary
  - NFS 3.0 specifically                         -> blob with NFS 3.0, see notes

match:
  required:
    data_shape: [shared_file_system]
  preferred:
    access_protocol: [smb, nfs_posix]
    consumer: [vm, application, end_user_zpa]
    access_frequency: [frequent, mixed]
  disqualify:
    data_classification: [restricted_sovereign]

design:
  storage_kind: StorageV2
  performance_tier: Standard
  sku: Standard_ZRS
  replication: ZRS
  protocol_support:
    smb: "2.1 / 3.0 / 3.1"
    nfs: "4.1"
  private_endpoint:
    required: true
    sub_resource: file
    dns_zone: privatelink.file.core.windows.net
  data_protection:
    share_soft_delete: enabled
  backup:
    vault_type: Recovery Services Vault
    scope: Azure Files
    note: One Recovery Services Vault per subscription.
  monitoring:
    defender_for_storage: enabled
    diagnostics_to: Operational Log Analytics Workspace
    security_logs_to: Security Log Analytics Workspace
  scale_ceiling:
    max_iops: 20000
    ingress: "2,980 MiB/sec"
    egress: "5,960 MiB/sec"
    note: >
      If the workload needs more than this, the Standard tier is not the right fit —
      evaluate premium FileStorage or Azure NetApp Files with the platform team.

security_floor:
  public_network_access: Disabled
  min_tls_version: "TLS1_2"
  https_traffic_only: true
  allow_shared_key_access: false
  infrastructure_encryption: true
  network_default_action: Deny
  encryption: CMK
  key_vault_sku: Premium
  key_type: RSA-HSM
  identity_type: UserAssigned
  resource_lock: CanNotDelete

required_requests:
  - order: 1
    type: storage_account_create
    label: Storage Account (file shares)
  - order: 2
    type: private_endpoint
    label: Private Endpoint (file)
  - order: 3
    type: dns
    label: DNS — link privatelink.file.core.windows.net to the spoke VNET
  - order: 4
    type: zpa_rnd_routing
    label: ZPA Routing
    condition: consumer includes end_user_zpa

prerequisites:
  - An Azure subscription. If absent, request it from the HALO portal first.
  - An onboarded spoke VNET and subnet.
  - Key Vault Premium with RSA-HSM key and a user-assigned managed identity.
  - For SMB with AD authentication, confirm domain-join requirements with the identity team.

diagram: storage_files_private.mmd
cost_band: "$"

source:
  - doc: Presight Storage Design Document
    section: "2.8 G42 Cloud to Microsoft Azure Storage Mapping"
    states: Scalable File System maps to Azure Files (NFS v4.1); Azure NetApp Files supports NFS 3.0/4.1 and SMB 2.1/3.0/3.1.
  - doc: Presight Storage Design Document
    section: "2.6 Performance Efficiency"
    states: Azure Files Standard GP — 20,000 IOPS, ingress 2,980 MiB/sec, egress 5,960 MiB/sec.
  - doc: G42-AzurePlatformDesign-v1.2
    section: "2.7.3 Azure Backup Approach"
    states: Recovery Services Vault covers Azure VMs, SQL in Azure VMs and Azure Files.
